[package]
name = "fractal_kernel"
version = "0.2.0"  # gravée dans la DLL (build.rs) : à monter à chaque livraison
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wide = "0.7"

[build-dependencies]
embed-resource = "2.4"   # ressource de version Windows (rc.exe du SDK)

# pas de panic = "abort" : fk_compute_row rattrape les paniques avec catch_unwind
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
